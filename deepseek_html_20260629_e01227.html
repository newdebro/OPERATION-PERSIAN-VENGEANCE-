            function drawRoundRect(ctx, x, y, w, h, r) {
                if (typeof ctx.roundRect === 'function') {
                    ctx.beginPath();
                    ctx.roundRect(x, y, w, h, r);
                } else {
                    r = Math.min(r, w / 2, h / 2);
                    ctx.beginPath();
                    ctx.moveTo(x + r, y);
                    ctx.lineTo(x + w - r, y);
                    ctx.arcTo(x + w, y, x + w, y + r, r);
                    ctx.lineTo(x + w, y + h - r);
                    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
                    ctx.lineTo(x + r, y + h);
                    ctx.arcTo(x, y + h, x, y + h - r, r);
                    ctx.lineTo(x, y + r);
                    ctx.arcTo(x, y, x + r, y, r);
                    ctx.closePath();
                }

            function initAudio() {
                if (!audioCtx) {
                    try { audioCtx = new(window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx =
                            null; }
                }
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            }

            function playSound(freq, type, duration, vol = 0.10, glideTo = null, delay = 0, extraOsc = null) {
                if (!audioCtx) return;
                try {
                    const t = audioCtx.currentTime + delay;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, t);
                    if (glideTo) osc.frequency.linearRampToValueAtTime(glideTo, t + duration);
                    gain.gain.setValueAtTime(Math.min(vol, 0.25), t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(t);
                    osc.stop(t + duration + 0.05);
                    if (extraOsc) {
                        const osc2 = audioCtx.createOscillator();
                        const gain2 = audioCtx.createGain();
                        osc2.type = extraOsc.type || type;
                        osc2.frequency.setValueAtTime(extraOsc.freq || freq * 1.5, t);
                        gain2.gain.setValueAtTime(Math.min(vol * 0.6, 0.12), t);
                        gain2.gain.exponentialRampToValueAtTime(0.001, t + duration * 0.8);
                        osc2.connect(gain2);
                        gain2.connect(audioCtx.destination);
                        osc2.start(t);
                        osc2.stop(t + duration + 0.05);
                    }
                } catch (e) {}
            }

            function lightenColor(hex, amount) {
                let r, g, b;
                if (hex.startsWith('#')) { r = parseInt(hex.slice(1, 3), 16);
                    g = parseInt(hex.slice(3, 5), 16);
                    b = parseInt(hex.slice(5, 7), 16); } else if (hex.startsWith('rgb')) { const m = hex.match(/\d+/g); if (
                        m) { r = +m[0];
                        g = +m[1];
                        b = +m[2]; } else return hex; } else return hex;
                r = Math.min(255, r + amount);
                g = Math.min(255, g + amount);
                b = Math.min(255, b + amount);
                return `rgb(${r},${g},${b})`;
            }

            function darkenColor(hex, amount) {
                let r, g, b;
                if (hex.startsWith('#')) { r = parseInt(hex.slice(1, 3), 16);
                    g = parseInt(hex.slice(3, 5), 16);
                    b = parseInt(hex.slice(5, 7), 16); } else if (hex.startsWith('rgb')) { const m = hex.match(/\d+/g); if (
                        m) { r = +m[0];
                        g = +m[1];
                        b = +m[2]; } else return hex; } else return hex;
                r = Math.max(0, r - amount);
                g = Math.max(0, g - amount);
                b = Math.max(0, b - amount);
                return `rgb(${r},${g},${b})`;
            }

                const weights = [0.22, 0.20, 0.18, 0.16, 0.06, 0.04, 0.08, 0.06];
                const roll = Math.random();
                let typeIndex = 0,
                    cumulative = 0;
                for (let i = 0; i < types.length; i++) {
                    cumulative += weights[i];
                    if (roll <= cumulative) { typeIndex = i; break; }
                }
                powerUps.push({
                    x,
                    y,
                    type: types[typeIndex],
                    life: 10.0,
                    maxLife: 10.0,
                    size: 20,
                    pulse: 0,

            function killEnemy(enemy, tapX, tapY) {
                if (!enemy.alive || enemy.tapped) return;
                if (enemy.isBoss || enemy.isGiant) {
                    enemy.hp--;
                    enemy.hitFlash = 0.35;
                    spawnSparkParticles(tapX, tapY, 30, '#ff4400');
                    screenPulse = Math.max(screenPulse, 0.22);
                    damageNumbers.push({ x: tapX, y: tapY - enemy.size, text: '-1', color: '#ff4400', life: 1.3,
                        maxLife: 1.3, vy: -5.5 });
                    if (enemy.hp <= 0) {
                        enemy.alive = false;
                        enemy.tapped = true;
                        enemy.deathTimer = 0;
                        spawnExplosion(enemy.x, enemy.y, enemy.isGiant ? 2.8 : 2.2);
                        if (enemy.isGiant) {
                            sfxBossKill();
                            sfxShockwave();
                            screenFlash = 1.4;
                            screenFlashColor = '#ff0000';
                            screenPulse = 0.95;
                            score += 3000;
                            spawnFloatingText(enemy.x, enemy.y - enemy.size, 'GIANT SLAIN! +3000', '#ff0000', 2.8);
                            spawnScrollText('A COLOSSUS HAS FALLEN! THE ENEMY TREMBLES!', '#ff2200', 5.0);
                            triggerGiantKillAchievement();
                            superKillFlash = 1.0;
                            superKillColor = '#ff0000';
                            godRayAlpha = 0.85;
                            godRayX = enemy.x;
                            godRayY = enemy.y;
                            spawnPropagandaOverlay('THE GREAT SATAN STRIKES!', 3.0);
                        } else {
                            sfxBossKill();
                            screenFlash = 1.2;
                            screenFlashColor = '#ff3300';
                            screenPulse = 0.80;
                            score += 1500;
                            spawnFloatingText(enemy.x, enemy.y - enemy.size, 'BOSS DEFEATED! +1500', '#ffaa00', 2.4);
                            spawnScrollText('THE COMMANDER HAS FALLEN!', '#ff6600', 4.0);
                            triggerBossKillAchievement();
                            spawnPropagandaOverlay('LEADERSHIP DECAPITATED!', 3.0);
                        }
                        bossEnemy = null;
                        bossWarning = 0;
                        totalKills++;
                        if (enemy.dropPowerUp) {
                            spawnPowerUp(enemy.x, enemy.y);
                            spawnPowerUp(enemy.x + 40, enemy.y - 30);
                            spawnPowerUp(enemy.x - 34, enemy.y - 20);
                            if (enemy.isGiant) {
                                spawnPowerUp(enemy.x + 55, enemy.y - 45);
                                spawnPowerUp(enemy.x - 50, enemy.y - 40);
                                spawnPowerUp(enemy.x, enemy.y - 55);
                            }
                        }
                        moraleLevel = Math.min(100, moraleLevel + 30);
                        sfxMoraleBoost();
                        killCamActive = true;
                        killCamTimer = 0.7;
                        killCamX = enemy.x;
                        killCamY = enemy.y;
                        killCamScale = enemy.isGiant ? 3.8 : 2.8;
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('persianVengeanceHighScore', highScore);
                        }
                        spawnKillFeed(`💀 ${enemy.isGiant?'GIANT':'BOSS'} ELIMINATED!`, '#ff4400');
                    }
                    return;
                }
                if (enemy.isElite && enemy.hp > 1) {
                    enemy.hp--;
                    enemy.hitFlash = 0.25;
                    spawnSparkParticles(tapX, tapY, 20, '#ffaa00');
                    damageNumbers.push({ x: tapX, y: tapY - enemy.size, text: '-1', color: '#ffaa00', life: 1.1,
                        maxLife: 1.1, vy: -5 });
                    screenPulse = Math.max(screenPulse, 0.14);
                    return;
                }
                if (enemy.isChinese && enemy.hp > 1) {
                    enemy.hp--;
                    enemy.hitFlash = 0.25;
                    spawnSparkParticles(tapX, tapY, 18, '#ff8800');
                    damageNumbers.push({ x: tapX, y: tapY - enemy.size, text: '-1', color: '#ff8800', life: 1.1,
                        maxLife: 1.1, vy: -5 });
                    screenPulse = Math.max(screenPulse, 0.14);

            function handleTap(tx, ty) {
                initAudio();
                if (gameState === 'menu') { sfxMenuClick();
                    transitionTarget = 'cutscene';
                    transitionAlpha = 0.01; return; }
                if (gameState === 'gameover') { sfxMenuClick();
                    resetGame();
                    gameState = 'menu'; return; }
                if (gameState === 'cutscene') { sfxMenuClick();
                    cutscenePhase = 999;
                    cutsceneTimer = 999; return; }
                if (gameState !== 'playing') return;
                if (tutorialPhase > 0 && tutorialPhase < 8) {
                    tutorialTimer = Math.min(tutorialTimer, 0.35);
                }
                sfxTap();
                for (let i = powerUps.length - 1; i >= 0; i--) {
                    const pu = powerUps[i];
                    if (Math.hypot(tx - pu.x, ty - pu.y) < pu.size + 18) {
                        activatePowerUp(pu.type);
                        powerUps.splice(i, 1);
                        return;
                    }
                }
                let hitAny = false;
                const sorted = enemies.filter(e => e.alive && !e.tapped).sort((a, b) => Math.hypot(tx - a.x, ty - a.y) -
                    Math.hypot(tx - b.x, ty - b.y));
                for (const enemy of sorted) {
                    const hitRadius = enemy.size * (enemy.isBoss ? 1.3 : enemy.isGiant ? 1.4 : enemy.isElite ? 1.1 :
                        1.0);
                    if (Math.hypot(tx - enemy.x, ty - enemy.y) < hitRadius) {
                        killEnemy(enemy, tx, ty);
                        hitAny = true;
                        break;
                    }
                }
                if (!hitAny) {
                    spawnSparkParticles(tx, ty, 10, '#ffffff');
                    comboCount = 0;
                    comboTimer = 0;
                    comboGlow = 0;
                    rapidKillCount = 0;
                    flareParticles.push({ x: tx, y: ty, life: 0.8, maxLife: 0.8, size: 10, alpha: 0.85 });
                }
            }

            function drawCutscene() {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, W, H);
                const frame = cutsceneFrames[cutscenePhase];
                if (!frame) { gameState = 'playing';
                    resetGame(); return; }
                if (frame.bg === 'night') {
                    const grad = ctx.createLinearGradient(0, 0, 0, H);
                    grad.addColorStop(0, '#040412');
                    grad.addColorStop(0.35, '#0c0820');
                    grad.addColorStop(0.65, '#180e26');
                    grad.addColorStop(1, '#281410');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, W, H);
                    for (let i = 0; i < 120; i++) {
                        const sx = (i * 137 + 50) % W;
                        const sy = (i * 89 + 30) % (H * 0.52);
                        const twinkleVal = 0.25 + Math.sin(frameCount * 0.028 + i * 1.7) * 0.45;
                        ctx.fillStyle = `rgba(255,255,240,${twinkleVal})`;
                        ctx.beginPath();
                        ctx.arc(sx, sy, 0.7 + Math.abs(Math.sin(i * 0.7)) * 1.8, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.fillStyle = '#ffe8c0';
                    ctx.beginPath();
                    ctx.arc(W * 0.72, H * 0.16, 48, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#040412';
                    ctx.beginPath();
                    ctx.arc(W * 0.72 + 16, H * 0.16 - 9, 40, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,50,0,0.08)';
                    ctx.fillRect(0, 0, W, H);
                } else if (frame.bg === 'desert') {
                    const grad = ctx.createLinearGradient(0, 0, 0, H);
                    grad.addColorStop(0, '#b88040');
                    grad.addColorStop(0.30, '#d4a860');
                    grad.addColorStop(0.55, '#d0a050');
                    grad.addColorStop(1, '#906030');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, W, H);
                    ctx.fillStyle = '#c08838';
                    ctx.beginPath();
                    ctx.moveTo(0, H * 0.50);
                    ctx.quadraticCurveTo(W * 0.25, H * 0.40, W * 0.5, H * 0.46);
                    ctx.quadraticCurveTo(W * 0.7, H * 0.48, W * 0.9, H * 0.42);
                    ctx.quadraticCurveTo(W, H * 0.40, W, H * 0.44);
                    ctx.lineTo(W, H);
                    ctx.lineTo(0, H);
                    ctx.fill();
                    ctx.fillStyle = '#ffe8a0';
                    ctx.beginPath();
                    ctx.arc(W * 0.68, H * 0.20, 56, 0, Math.PI * 2);
                    ctx.fill();
                    for (let i = 0; i < 30; i++) {

                        ctx.arc(sx, sy, 2 + i % 6, 0, Math.PI * 2);

                    }
                } else if (frame.bg === 'flag') {
                    const grad = ctx.createLinearGradient(0, 0, 0, H);
                    grad.addColorStop(0, '#0a0a28');
                    grad.addColorStop(0.5, '#181240');

                            ctx.fillStyle = '#ffffff';
                            ctx.font = `${Math.min(W*0.030,12)}px serif`;
                            ctx.fillText('★', W * 0.14 + c * 18, H * 0.26 + r * 24);
                        }
                    ctx.fillStyle = '#ffffff';
                    ctx.font = `${Math.min(W*0.085,34)}px serif`;
                    ctx.fillText('🦅', W * 0.72, H * 0.55);
                    for (let i = 0; i < 20; i++) {
                        const sx = (i * 97 + 23) % W;
                        const sy = (i * 61 + 71) % (H * 0.6) + H * 0.08;
                        ctx.fillStyle = `rgba(255,255,200,${0.03+Math.sin(i+frameCount*0.015)*0.02})`;
                        ctx.beginPath();
                        ctx.arc(sx, sy, 1 + i % 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                const boxY = H * 0.46,
                    boxH = H * 0.50;
                ctx.fillStyle = 'rgba(0,0,0,0.88)';
                drawRoundRect(ctx, W * 0.03, boxY, W * 0.94, boxH, 16);
                ctx.fill();
                ctx.strokeStyle = '#d4a017';
                ctx.lineWidth = 3.5;
                drawRoundRect(ctx, W * 0.03, boxY, W * 0.94, boxH, 16);
                ctx.stroke();
                ctx.strokeStyle = 'rgba(180,120,30,0.40)';
                ctx.lineWidth = 1.2;
                drawRoundRect(ctx, W * 0.045, boxY + 6, W * 0.91, boxH - 12, 8);
                ctx.stroke();
                const fullText = frame.text;
                const displayedChars = Math.min(cutsceneCharIndex, fullText.length);
                const displayedText = fullText.substring(0, displayedChars);
                ctx.fillStyle = '#f5e6c8';
                ctx.font = `${Math.min(W*0.043,18)}px Georgia, serif`;
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(0,0,0,0.85)';
                ctx.shadowBlur = 8;
                displayedText.split('\n').forEach((line, i) => ctx.fillText(line, W / 2, boxY + 38 + i * 30));
                ctx.shadowBlur = 0;
                if (displayedChars < fullText.length && frameCount % 2 === 0) {
                    cutsceneCharIndex++;
                    if (frameCount % 3 === 0) sfxCutsceneBeep();
                }
                ctx.fillStyle = 'rgba(255,255,255,0.55)';
                ctx.font = `${Math.min(W*0.030,12)}px Georgia, serif`;
                ctx.fillText('TAP TO SKIP ▸▸▸', W / 2, H * 0.978);
                const moodColors = { ominous: '#884444', defiant: '#d4a017', dark: '#442222', tense: '#888833',
                    angry: '#ff4422', commanding: '#ffaa00', epic: '#ff8844', powerful: '#ff6600',
                    intense: '#ff4444', foreboding: '#664444', hopeful: '#4488ff', determined: '#88aaff',
                    urgent: '#ff8844', resolute: '#88aaff', triumphant: '#ffdd00', furious: '#ff2200' };
                const moodColor = moodColors[frame.mood] || '#ffffff';
                ctx.fillStyle = moodColor;
                ctx.globalAlpha = 0.25 + Math.sin(frameCount * 0.04) * 0.12;
                ctx.fillRect(0, 0, W, 4);
                ctx.fillRect(0, H - 4, W, 4);
                ctx.globalAlpha = 1;
                cutsceneTimer += 1 / 60;
                if (cutsceneTimer > frame.duration && displayedChars >= fullText.length) {
                    cutscenePhase++;
                    advanceCutscene();
                }
                if (cutsceneTimer > frame.duration + 3.0) { cutscenePhase++;
                    advanceCutscene(); }
            }

            function drawGameBackground() {
                const timeOfDay = wave % 6 < 3 ? 'day' : 'night';
                if (timeOfDay === 'day') {
                    const grad = ctx.createLinearGradient(0, 0, 0, H);
                    grad.addColorStop(0, '#182e3c');
                    grad.addColorStop(0.22, '#7ea8c8');
                    grad.addColorStop(0.42, '#c8a060');
                    grad.addColorStop(0.52, '#d4b870');
                    grad.addColorStop(0.72, '#c09850');
                    grad.addColorStop(1, '#7a5a2a');
                    ctx.fillStyle = grad;
                } else {
                    const grad = ctx.createLinearGradient(0, 0, 0, H);
                    grad.addColorStop(0, '#040418');
                    grad.addColorStop(0.28, '#180e2a');
                    grad.addColorStop(0.48, '#381e1e');
                    grad.addColorStop(0.68, '#482e1e');
                    grad.addColorStop(1, '#2e1c0e');
                    ctx.fillStyle = grad;
                }
                ctx.fillRect(0, 0, W, H);
                if (timeOfDay === 'night')
                    for (const star of bgStars) {
                        const twinkleVal = 0.35 + Math.sin(star.twinkle + frameCount * 0.018) * 0.55;
                        ctx.fillStyle = star.hue + twinkleVal + ')';
                        ctx.beginPath();
                        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                for (const cloud of bgClouds) {
                    ctx.fillStyle = `rgba(255,255,255,${cloud.alpha})`;
                    ctx.beginPath();
                    ctx.ellipse(cloud.x, cloud.y, cloud.width, cloud.height, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(cloud.x + cloud.width * 0.38, cloud.y - cloud.height * 0.28, cloud.width * 0.55,
                        cloud.height * 0.75, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                for (const fp of fogParticles) {
                    ctx.fillStyle = `rgba(180,160,140,${fp.alpha})`;
                    ctx.beginPath();
                    ctx.arc(fp.x, fp.y, fp.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillStyle = timeOfDay === 'day' ? '#9a7040' : '#563820';
                ctx.fillRect(0, H * 0.78, W, H * 0.22);
                ctx.fillStyle = timeOfDay === 'day' ? '#8a6830' : '#452818';
                for (let i = 0; i < 18; i++) {
                    ctx.beginPath();
                    ctx.arc((i * 137 + 55) % W, H * 0.78 + (i * 29) % 62, 16 + i * 8, 0, Math.PI);
                    ctx.fill();
                }
                for (const gs of groundScars) {
                    ctx.fillStyle = `rgba(30,10,0,${gs.alpha})`;
                    ctx.beginPath();
                    ctx.arc(gs.x, gs.y, gs.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                const lineY = H * 0.88;
                ctx.strokeStyle = '#ff3333';
                ctx.lineWidth = 5;
                ctx.setLineDash([14, 24]);
                ctx.beginPath();
                ctx.moveTo(0, lineY);
                ctx.lineTo(W, lineY);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = '#ff0000';
                ctx.font = `bold ${Math.min(W*0.034,13)}px Georgia, serif`;
                ctx.textAlign = 'center';
                const linePulse = 1 + Math.sin(frameCount * 0.05) * 0.08;
                ctx.fillText('⚠ DEFENSE LINE — DO NOT CROSS ⚠', W / 2, lineY - 16 * linePulse);
                ctx.fillStyle = '#aa0000';
                ctx.font = `${Math.min(W*0.024,9)}px Georgia, serif`;
                ctx.fillText('CROSS = DEATH', W / 2, lineY + 18);
                ctx.textAlign = 'left';
                if (weatherEffect === 'sandstorm')
                    for (const sp of sandParticles) {
                        sp.x += sp.speed * weatherIntensity;
                        sp.y += sp.speed * 0.3 * weatherIntensity + Math.sin(sp.wobble + frameCount * 0.05) * 0.8;
                        if (sp.x > W + 18) sp.x = -18;
                        if (sp.y > H + 18) sp.y = -18;
                        ctx.fillStyle = `rgba(200,160,100,${sp.alpha*weatherIntensity})`;
                        ctx.beginPath();
                        ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                if (weatherEffect === 'rain')
                    for (const rd of rainDrops) {
                        rd.y += rd.speed;
                        if (rd.y > H) { rd.y = -20;
                            rd.x = Math.random() * W; }
                        ctx.strokeStyle = `rgba(150,180,220,${rd.alpha})`;
                        ctx.lineWidth = 1.2;
                        ctx.beginPath();
                        ctx.moveTo(rd.x, rd.y);
                        ctx.lineTo(rd.x - 1.5, rd.y + rd.length);
                        ctx.stroke();
                    }
                for (const dp of dustParticles) {
                    dp.y += dp.vy;
                    dp.life -= 0.016;
                    if (dp.life <= 0 || dp.y < H * 0.5) { dp.y = H * 0.75 + Math.random() * H * 0.25;
                        dp.life = dp.maxLife; }
                    ctx.fillStyle = `rgba(180,140,100,${dp.alpha*(dp.life/dp.maxLife)})`;
                    ctx.beginPath();
                    ctx.arc(dp.x, dp.y, dp.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                for (const ep of emberParticles) {
                    ep.y += ep.vy;
                    ep.x += ep.vx;
                    ep.life -= 0.02;
                    if (ep.life <= 0 || ep.y < H * 0.5) { ep.y = H * 0.7 + Math.random() * H * 0.3;
                        ep.x = Math.random() * W;
                        ep.life = ep.maxLife; }
                    const emAlpha = ep.alpha * (ep.life / ep.maxLife);
                    ctx.fillStyle = `rgba(255,${120+Math.floor(ep.glow*80)},20,${emAlpha})`;
                    ctx.beginPath();
                    ctx.arc(ep.x, ep.y, ep.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = `rgba(255,200,60,${emAlpha*0.55})`;
                    ctx.beginPath();
                    ctx.arc(ep.x, ep.y, ep.size * 2.6, 0, Math.PI * 2);
                    ctx.fill();
                }
                for (const fl of fallingLeaves) {
                    fl.y += fl.vy;
                    fl.x += fl.vx + Math.sin(frameCount * 0.02 + fl.x) * 0.35;
                    fl.rotation += fl.rotSpeed;
                    if (fl.y > H + 20) { fl.y = -20;
                        fl.x = Math.random() * W; }
                    ctx.save();
                    ctx.translate(fl.x, fl.y);
                    ctx.rotate(fl.rotation);
                    ctx.fillStyle = `rgba(${fl.color},${fl.alpha})`;
                    ctx.fillRect(-fl.size / 2, -fl.size / 4, fl.size, fl.size / 2);
                    ctx.restore();
                }
                if (thunderFlash > 0.01) {
                    ctx.fillStyle = `rgba(255,255,255,${thunderFlash})`;
                    ctx.fillRect(0, 0, W, H);
                }
                if (godRayAlpha > 0.01) {
                    const rayGrad = ctx.createLinearGradient(godRayX, godRayY - 300, godRayX, godRayY + 100);
                    rayGrad.addColorStop(0, `rgba(255,255,200,${godRayAlpha})`);
                    rayGrad.addColorStop(0.5, `rgba(255,200,100,${godRayAlpha*0.5})`);
                    rayGrad.addColorStop(1, 'rgba(255,100,0,0)');
                    ctx.fillStyle = rayGrad;
                    ctx.fillRect(godRayX - 140, godRayY - 300, 280, 400);
                    godRayAlpha *= 0.94;
                    if (godRayAlpha < 0.005) godRayAlpha = 0;
                }
                if (propagandaOverlay > 0.01) {
                    ctx.fillStyle = `rgba(0,0,0,${propagandaOverlay*0.45})`;
                    ctx.fillRect(0, H * 0.35, W, H * 0.30);
                    ctx.fillStyle = `rgba(255,220,50,${propagandaOverlay})`;
                    ctx.font = `bold ${Math.min(W*0.080,32)}px Georgia, serif`;
                    ctx.textAlign = 'center';
                    ctx.fillText(propagandaOverlayText, W / 2, H * 0.50);
                    ctx.textAlign = 'left';
                }
            }

            function drawHUD() {
                ctx.fillStyle = 'rgba(0,0,0,0.82)';
                ctx.fillRect(0, 0, W, 56);
                ctx.fillStyle = '#ffffff';
                ctx.font = `bold ${Math.min(W*0.040,15)}px Georgia, serif`;
                ctx.textAlign = 'left';
                ctx.fillText(`🎯 ${score}`, 10, 25);
                ctx.textAlign = 'right';
                ctx.fillText(`🌊 ${wave}`, W - 10, 25);
                ctx.font = `${Math.min(W*0.031,12)}px serif`;
                const heartStr = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, maxLives - lives));
                ctx.fillText(heartStr, W - 10, 44);
                ctx.textAlign = 'center';
                if (moraleLevel < 100) {
                    const moraleBarW = W * 0.55,
                        moraleBarH = 7,
                        moraleBarX = W / 2 - moraleBarW / 2,
                        moraleBarY = 49;
                    ctx.fillStyle = 'rgba(0,0,0,0.65)';
                    ctx.fillRect(moraleBarX - 2, moraleBarY - 2, moraleBarW + 4, moraleBarH + 4);
                    const moraleGrad = ctx.createLinearGradient(moraleBarX, 0, moraleBarX + moraleBarW, 0);
                    moraleGrad.addColorStop(0, '#ff0000');
                    moraleGrad.addColorStop(0.5, '#ffaa00');
                    moraleGrad.addColorStop(1, '#00ff00');
                    ctx.fillStyle = moraleGrad;
                    ctx.fillRect(moraleBarX, moraleBarY, moraleBarW * (moraleLevel / 100), moraleBarH);
                    ctx.fillStyle = '#fff';
                    ctx.font = `${Math.min(W*0.023,9)}px serif`;
                    ctx.fillText(`MORALE: ${Math.floor(moraleLevel)}%`, W / 2, moraleBarY - 4);
                }
                if (killStreakTimer > 0 && killStreak >= 3) {
                    const alpha = Math.min(1, killStreakTimer);
                    ctx.fillStyle = `rgba(255,200,0,${alpha})`;
                    ctx.font = `bold ${Math.min(W*0.050,17)* (1+Math.sin(frameCount*0.22)*0.22)}px Georgia, serif`;
                    ctx.fillText(`⚡ KILL STREAK: ${killStreak}x ⚡`, W / 2, 64);
                }
                if (comboCount >= 3 && comboTimer > 0) {
                    const comboAlpha = Math.min(1, comboTimer);
                    const comboSize = 1 + comboGlow * 0.38;
                    ctx.fillStyle = `rgba(255,80,30,${comboAlpha})`;
                    ctx.font = `bold ${Math.min(W*0.040,13)*comboSize}px Georgia, serif`;
                    ctx.fillText(`🔥 COMBO x${comboCount}`, W / 2, 80);
                }
                if (rapidKillTimer > 0 && rapidKillCount >= 4) {
                    ctx.fillStyle = `rgba(255,0,200,${Math.min(1,rapidKillTimer)})`;
                    ctx.font = `bold ${Math.min(W*0.036,12)}px Georgia, serif`;
                    ctx.fillText(`💥 RAPID FIRE x${rapidKillCount}!`, W / 2, 96);
                }
                if (activePowerUp && powerUpTimer > 0) {
                    const alpha = Math.min(1, powerUpTimer);
                    ctx.fillStyle =
                        `rgba(${activePowerUp==='slowmo'?'100,180,255':'150,200,255'},${alpha})`;
                    ctx.font = `bold ${Math.min(W*0.036,13)}px Georgia, serif`;
                    ctx.fillText(
                        `${activePowerUp==='slowmo'?'⏳ SLOW':'🛡️ SHIELD'} ${Math.ceil(powerUpTimer)}s`, W / 2,
                        112);
                }
                if (divineActive && divineInterventionTimer > 0) {
                    ctx.fillStyle = `rgba(255,220,255,${Math.min(1,divineInterventionTimer/1.5)})`;
                    ctx.font = `bold ${Math.min(W*0.035,13)}px Georgia, serif`;
                    ctx.fillText(`✨ DIVINE ${Math.ceil(divineInterventionTimer)}s`, W / 2, 128);
                }
                if (hellfireActive && hellfireTimer > 0) {
                    ctx.fillStyle = `rgba(255,100,20,${Math.min(1,hellfireTimer/1.5)})`;
                    ctx.font = `bold ${Math.min(W*0.035,13)}px Georgia, serif`;
                    ctx.fillText(`🔥 HELLFIRE ${Math.ceil(hellfireTimer)}s`, W / 2, 128);
                }
                if (divineWrathActive && divineWrathTimer > 0) {
                    ctx.fillStyle = `rgba(255,200,50,${Math.min(1,divineWrathTimer/1.5)})`;
                    ctx.font = `bold ${Math.min(W*0.035,13)}px Georgia, serif`;
                    ctx.fillText(`⚡ WRATH ${Math.ceil(divineWrathTimer)}s`, W / 2, 128);
                }
                if (bossEnemy && bossEnemy.alive) {
                    const barW = W * 0.74,
                        barH = 13,
                        barX = W / 2 - barW / 2,
                        barY = 110;
                    ctx.fillStyle = 'rgba(0,0,0,0.80)';
                    ctx.fillRect(barX - 3, barY - 3, barW + 6, barH + 6);
                    ctx.fillStyle = '#330000';
                    ctx.fillRect(barX, barY, barW, barH);
                    const hpGrad = ctx.createLinearGradient(barX, barY, barX + barW, barY);
                    hpGrad.addColorStop(0, '#ff0000');
                    hpGrad.addColorStop(0.5, '#ff4400');
                    hpGrad.addColorStop(1, '#ff8800');
                    ctx.fillStyle = hpGrad;
                    ctx.fillRect(barX, barY, barW * (bossEnemy.hp / bossEnemy.maxHp), barH);
                    ctx.strokeStyle = '#d4a017';
                    ctx.lineWidth = 2.8;
                    ctx.strokeRect(barX, barY, barW, barH);
                    ctx.fillStyle = '#fff';
                    ctx.font = `bold ${Math.min(W*0.028,10)}px Georgia, serif`;
                    ctx.fillText(`BOSS: ${bossEnemy.phrase.substring(0,32)}...`, W / 2, barY - 8);
                }
                ctx.textAlign = 'left';
                for (let i = 0; i < killFeedEntries.length; i++) {
                    const entry = killFeedEntries[i];
                    entry.y += (140 + i * 24 - entry.y) * 0.08;
                    entry.life -= 1 / 60;
                    const alpha = Math.min(1, entry.life / 1.5);

            function update(dt) {
                const effectiveDt = dt * slowMotion;
                lastEffectiveDt = effectiveDt;
                if (gameState === 'menu') {
                    for (const smoke of bgSmoke) { smoke.y -= smoke.speed;
                        smoke.x += smoke.drift; if (smoke.y < -smoke.size) { smoke.y = H + smoke.size;

                            smoke.x < -smoke.size) smoke.x = W + smoke.size; }

                            .width; }

                if (gameState === 'cutscene' || gameState === 'gameover') return;

                    tutorialTimer = 3.5; }

                    0.55);
                if (divineInterventionTimer > 0) { divineInterventionTimer -= effectiveDt; if (
                        divineInterventionTimer <= 0) { divineActive = false;
                        divineGlow = 0;
                        enemies.forEach(e => { if (e.alive) e.speed = e.speed * 2.85; }); } }
                if (hellfireTimer > 0) { hellfireTimer -= effectiveDt; if (hellfireTimer <= 0) hellfireActive = false; }
                if (divineWrathTimer > 0) { divineWrathTimer -= effectiveDt; if (divineWrathTimer <= 0) divineWrathActive =
                        false; }

                        comboGlow = 0; } }

                if (comboGlow < 0.004) comboGlow = 0;
                if (rapidKillTimer > 0) rapidKillTimer -= effectiveDt;
                if (screenFlash > 0) screenFlash *= 0.84;
                if (screenFlash < 0.006) screenFlash = 0;
                if (screenPulse > 0) screenPulse *= 0.86;
                if (screenPulse < 0.004) screenPulse = 0;

                    moraleTimer = 0.5; }
                if (killCamTimer > 0) killCamTimer -= effectiveDt;
                if (narrativePopupTimer > 0) { narrativePopupTimer -= effectiveDt;
                    narrativePopupAlpha = Math.min(1, narrativePopupTimer / 1.5); }
                if (crusadeChantTimer > 0) crusadeChantTimer -= effectiveDt;
                if (propagandaOverlayTimer > 0) { propagandaOverlayTimer -= effectiveDt;

                if (propagandaOverlay < 0.005) propagandaOverlay = 0;

                if (bossWarning > 0) bossWarning -= effectiveDt;

                        .random() < 0.5 ? 'zigzag' : 'normal'));

                if (wave % 5 === 0 && !bossEnemy && difficultyTimer > 8 && noBossAlive && bossWarning <= 0) {

                    if (wave % 3 === 0 && lives < maxLives) { lives++;
                        spawnFloatingText(W / 2, H * 0.43, '+1 LIFE ❤️', '#00ff88', 1.8);

                    if (wave >= 5 && wave % 5 === 0 && Math.random() > 0.35) {

                    }
                    if (wave >= 10) {
                        crusadeChantTimer = 2.5;
                        crusadeChantIndex = Math.floor(Math.random() * 5);

                    if (wave >= 8 && Math.random() > 0.4) {
                        spawnPropagandaOverlay('THE ENEMY WILL BURN!', 2.5);
                    }
                    waveBonusTimer = 2.0; }
                if (waveBonusTimer > 0) { waveBonusTimer -= effectiveDt; if (waveBonusTimer > 0) { moraleLevel = Math
                            .min(100, moraleLevel + 0.5); } }
                for (const enemy of enemies) {
                    if (!enemy.alive) { enemy.deathTimer += effectiveDt; continue; }
                    enemy.y += enemy.speed * (1 + wave * 0.08);
                    enemy.animPhase += effectiveDt * 3.8;
                    if (enemy.zigzagAmp > 0) { enemy.zigzagPhase += enemy.zigzagFreq;
                        enemy.x += Math.sin(enemy.zigzagPhase) * enemy.zigzagAmp * 0.32;
                        enemy.x = Math.max(enemy.size * 0.5, Math.min(W - enemy.size * 0.5, enemy.x)); }
                    if (enemy.hitFlash > 0) enemy.hitFlash -= effectiveDt;
                    enemy.speechBubbleTimer -= effectiveDt;
                    if (enemy.speechBubbleTimer <= 0) { enemy.targetAlpha = enemy.targetAlpha > 0.4 ? 0 : (0.5 + Math
                            .random() * 0.5);
                        enemy.speechBubbleTimer = 1.4 + Math.random() * 4.5; }
                    enemy.speechBubbleAlpha += (enemy.targetAlpha - enemy.speechBubbleAlpha) * effectiveDt * 4.0;
                    if (enemy.y > H * 0.88 && enemy.alive) enemyReachedBottom(enemy);
                    if (enemy.willCommitAtrocity && enemy.atrocityTimer > 0) {
                        enemy.atrocityTimer -= effectiveDt;
                        if (enemy.atrocityTimer <= 0 && enemy.alive) {
                            enemy.atrocityTimer = 8 + Math.random() * 10;
                            if (Math.random() < 0.3) {
                                spawnNarrativePopup('🚨 ENEMY ATROCITY: ' + enemy.warCry, 3.0);
                                atrocityCount++;
                                if (atrocityCount >= 10) triggerWarCriminalAchievement();

                if (bossEnemy && !bossEnemy.alive && bossEnemy.deathTimer > 0.9) bossEnemy = null;
                for (const p of particles) { p.x += p.vx;

                for (const pu of powerUps) { pu.y += pu.vy;

                        const glowColors = { health: 'rgba(0,255,100,0.52)', bomb: 'rgba(255,150,0,0.52)',
                            slowmo: 'rgba(100,180,255,0.52)', score: 'rgba(255,220,0,0.52)',
                            shield: 'rgba(150,200,255,0.52)', divine: 'rgba(255,200,255,0.60)',
                            hellfire: 'rgba(255,50,0,0.55)', wrath: 'rgba(255,200,50,0.55)' };
                        ctx.fillStyle = glowColors[pu.type] || 'rgba(255,255,255,0.40)';
                        ctx.beginPath();
                        ctx.arc(pu.x, pu.y, pu.size * 1.8 * pulse, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = `rgba(0,0,0,${0.76*alpha})`;
                        ctx.beginPath();
                        ctx.arc(pu.x, pu.y, pu.size * pulse, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
                        ctx.lineWidth = 3;
                        ctx.stroke();
                        const icons = { health: '❤️', bomb: '💣', slowmo: '⏳', score: '💰', shield: '🛡️',
                            divine: '✨', hellfire: '🔥', wrath: '⚡' };
                        ctx.font = `${pu.size*1.5*pulse}px serif`;
                        ctx.textAlign = 'center';
                        ctx.fillText(icons[pu.type] || '?', pu.x, pu.y + pu.size * 0.50 * pulse);
                        ctx.textAlign = 'left';
                    }
                    const sortedEnemies = [...enemies].sort((a, b) => a.y - b.y);
                    for (const enemy of sortedEnemies) {
                        if (!enemy.alive) {
                            const alpha = 1 - enemy.deathTimer / 1.0;
                            ctx.globalAlpha = Math.max(0, alpha);
                            if (enemy.isBoss || enemy.isGiant) {
                                const scaleAmount = 1 + enemy.deathTimer * 4.5;
                                ctx.save();
                                ctx.translate(enemy.x, enemy.y);
                                ctx.scale(scaleAmount, scaleAmount);
                                ctx.globalAlpha = Math.max(0, alpha * 0.65);
                                drawEnemySprite({ ...enemy, x: 0, y: 0 });
                                ctx.restore();
                            } else if (enemy.isChinese) {
                                ctx.globalAlpha = Math.max(0, alpha);
                                drawChineseEnemySprite(enemy);
                            } else if (enemy.isHezbollah) {
                                ctx.globalAlpha = Math.max(0, alpha);
                                drawHezbollahEnemySprite(enemy);
                            } else drawEnemySprite(enemy);
                            ctx.globalAlpha = 1;
                            continue;
                        }
                        if (enemy.hitFlash > 0) ctx.globalAlpha = 0.30 + Math.sin(enemy.hitFlash * 45) * 0.70;
                        if (enemy.isChinese) drawChineseEnemySprite(enemy);
                        else if (enemy.isHezbollah) drawHezbollahEnemySprite(enemy);
                        else drawEnemySprite(enemy);
                        ctx.globalAlpha = 1;
                        if (enemy.speechBubbleAlpha > 0.03 && enemy.alive) {
                            const bx = enemy.x,
                                by = enemy.y - enemy.size * 1.45;
                            const bubbleW = Math.min(enemy.phrase.length * 7 + 28, 260),
                                bubbleH = 38;
                            ctx.fillStyle = `rgba(255,255,255,${enemy.speechBubbleAlpha*0.93})`;
                            ctx.strokeStyle = `rgba(0,0,0,${enemy.speechBubbleAlpha})`;
                            ctx.lineWidth = 2;
                            drawRoundRect(ctx, bx - bubbleW / 2, by - bubbleH, bubbleW, bubbleH, 10);
                            ctx.fill();
                            ctx.stroke();
                            ctx.fillStyle = `rgba(255,255,255,${enemy.speechBubbleAlpha*0.93})`;
                            ctx.beginPath();
                            ctx.moveTo(bx - 10, by);
                            ctx.lineTo(bx, by + 13);
                            ctx.lineTo(bx + 10, by);
                            ctx.fill();
                            ctx.fillStyle = `rgba(0,0,0,${enemy.speechBubbleAlpha})`;
                            ctx.font = `${Math.min(W*0.028,10)}px Georgia, serif`;
                            ctx.textAlign = 'center';
                            ctx.fillText(enemy.phrase, bx, by - bubbleH + 24);
                            ctx.textAlign = 'left';
                        }
                        if ((enemy.isBoss || enemy.isGiant || enemy.isElite) && enemy.alive && enemy.hp < enemy.maxHp) {
                            const barW = enemy.size * (enemy.isBoss ? 1.8 : enemy.isGiant ? 2.0 : 1.3);
                            const barH = enemy.isBoss || enemy.isGiant ? 9 : 6;
                            const barX = enemy.x - barW / 2,
                                barY = enemy.y - enemy.size * (enemy.isBoss ? 1.75 : enemy.isGiant ? 1.8 : 1.38);
                            ctx.fillStyle = 'rgba(0,0,0,0.80)';
                            ctx.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);
                            ctx.fillStyle = '#440000';
                            ctx.fillRect(barX, barY, barW, barH);
                            const hpGrad = ctx.createLinearGradient(barX, barY, barX + barW, barY);
                            hpGrad.addColorStop(0, '#ff0000');
                            hpGrad.addColorStop(1, '#ff8800');
                            ctx.fillStyle = hpGrad;
                            ctx.fillRect(barX, barY, barW * (enemy.hp / enemy.maxHp), barH);
                        }
                        if ((enemy.isChinese || enemy.isHezbollah) && enemy.alive && enemy.hp < enemy.maxHp) {
                            const barW = enemy.size * 1.2;
                            const barH = 5;
                            const barX = enemy.x - barW / 2,
                                barY = enemy.y - enemy.size * 1.3;
                            ctx.fillStyle = 'rgba(0,0,0,0.80)';
                            ctx.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);
                            ctx.fillStyle = '#440000';
                            ctx.fillRect(barX, barY, barW, barH);
                            const hpGrad = ctx.createLinearGradient(barX, barY, barX + barW, barY);
                            hpGrad.addColorStop(0, '#ff8800');
                            hpGrad.addColorStop(1, '#ffcc00');
                            ctx.fillStyle = hpGrad;
                            ctx.fillRect(barX, barY, barW * (enemy.hp / enemy.maxHp), barH);
                        }
                    }
                    for (const p of particles) {
                        const alpha = p.life / p.maxLife;
                        ctx.save();
                        if (p.rotation && p.type === 'gore') {
                            ctx.translate(p.x, p.y);
                            ctx.rotate(p.rotation);
                            ctx.fillStyle = p.color;
                            ctx.globalAlpha = alpha;
                            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                        } else {
                            ctx.fillStyle = p.color;
                            ctx.globalAlpha = alpha;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, p.size * (0.5 + alpha * 0.5), 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.restore();
                    }
                    ctx.globalAlpha = 1;
                    for (const ft of floatingTexts) {
                        const alpha = ft.life / ft.maxLife;
                        const pulseScale = 1 + Math.sin(ft.pulse) * 0.14;
                        ctx.fillStyle = ft.color;
                        ctx.globalAlpha = alpha;
                        ctx.font = `bold ${Math.min(W*0.042,15)*ft.size*pulseScale}px Georgia, serif`;
                        ctx.textAlign = 'center';
                        ctx.fillText(ft.text, ft.x, ft.y);
                        ctx.textAlign = 'left';
                    }
                    for (const dn of damageNumbers) {
                        const alpha = dn.life / dn.maxLife;
                        ctx.fillStyle = dn.color;
                        ctx.globalAlpha = alpha;
                        ctx.font = `bold ${Math.min(W*0.058,21)}px Georgia, serif`;
                        ctx.textAlign = 'center';
                        ctx.fillText(dn.text, dn.x, dn.y);
                        ctx.textAlign = 'left';
                    }
                    for (const fp of flareParticles) {
                        ctx.fillStyle = `rgba(255,255,200,${fp.alpha})`;
                        ctx.beginPath();
                        ctx.arc(fp.x, fp.y, fp.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                    if (eagleX > -200 && eagleX < W + 120) {
                        ctx.save();
                        ctx.translate(eagleX, eagleY);
                        ctx.font = `${32+Math.sin(eagleWingFlap)*20}px serif`;
                        ctx.textAlign = 'center';
                        ctx.fillText('🦅', 0, 0);
                        ctx.restore();
                    }
                    if (divineActive && divineInterventionTimer > 0) {
                        for (const dp of divineParticles) {
                            const dpAlpha = dp.alpha * (dp.life / dp.maxLife) * 0.65;
                            ctx.fillStyle = `rgba(255,220,255,${dpAlpha})`;
                            ctx.beginPath();
                            ctx.arc(dp.x, dp.y, dp.size, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                    if (divineWrathActive && divineWrathTimer > 0) {
                        for (const dwp of divineWrathParticles) {
                            const dwa = dwp.alpha * (dwp.life / dwp.maxLife) * 0.6;
                            ctx.fillStyle = `rgba(${dwp.color},${dwa})`;
                            ctx.beginPath();
                            ctx.arc(dwp.x, dwp.y, dwp.size, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        const wg = ctx.createRadialGradient(W / 2, H * 0.5, 0, W / 2, H * 0.5, W * 0.9);
                        wg.addColorStop(0, 'rgba(255,200,50,0.06)');
                        wg.addColorStop(1, 'rgba(255,200,50,0)');
                        ctx.fillStyle = wg;
                        ctx.fillRect(0, 0, W, H);
                    }
                    if (hellfireActive && hellfireTimer > 0) {
                        for (const hp of hellfireParticles) {
                            const ha = hp.alpha * (hp.life / hp.maxLife) * 0.5;
                            ctx.fillStyle = `rgba(${hp.color},${ha})`;
                            ctx.beginPath();
                            ctx.arc(hp.x, hp.y, hp.size, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        const hg = ctx.createRadialGradient(W / 2, H * 0.5, 0, W / 2, H * 0.5, W * 0.8);
                        hg.addColorStop(0, 'rgba(255,50,0,0.05)');
                        hg.addColorStop(1, 'rgba(255,50,0,0)');
                        ctx.fillStyle = hg;
                        ctx.fillRect(0, 0, W, H);
                    }
                    if (divineGlow > 0.01) {
                        const dgGrad = ctx.createRadialGradient(W / 2, H * 0.5, 0, W / 2, H * 0.5, W * 1.2);
                        dgGrad.addColorStop(0, `rgba(255,200,255,${divineGlow*0.15})`);
                        dgGrad.addColorStop(1, 'rgba(255,200,255,0)');
                        ctx.fillStyle = dgGrad;
                        ctx.fillRect(0, 0, W, H);
                    }
                    for (const msp of moraleSurgeParticles) {
                        if (moraleLevel > 90 && msp.life > 0) {
                            const ma = msp.alpha * (msp.life / msp.maxLife) * 0.5;
                            ctx.fillStyle = `rgba(255,200,50,${ma})`;
                            ctx.beginPath();
                            ctx.arc(msp.x, msp.y, msp.size, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                    drawHUD();
                    drawTutorial();
                    if (gameState === 'gameover') drawGameOverScreen();
                    if (narrativePopupTimer > 0 && narrativePopupAlpha > 0.02) {
                        const nx = W * 0.05,
                            ny = H * 0.55,
                            nw = W * 0.9,
                            nh = 58;
                        ctx.fillStyle = `rgba(0,0,0,${0.85*narrativePopupAlpha})`;
                        drawRoundRect(ctx, nx, ny, nw, nh, 10);
                        ctx.fill();
                        ctx.strokeStyle = `rgba(255,200,50,${narrativePopupAlpha})`;
                        ctx.lineWidth = 2;
                        drawRoundRect(ctx, nx, ny, nw, nh, 10);
                        ctx.stroke();
                        ctx.fillStyle = `rgba(255,255,255,${narrativePopupAlpha})`;
                        ctx.font = `bold ${Math.min(W*0.034,12)}px Georgia, serif`;
                        ctx.textAlign = 'center';
                        ctx.fillText(narrativePopupText, W / 2, ny + 34);
                        ctx.textAlign = 'left';
                    }
                    if (killCamActive && killCamTimer > 0) {
                        ctx.restore();
                        const vignetteAlpha = Math.min(0.7, killCamTimer / 0.3);
                        const vg = ctx.createRadialGradient(W / 2, H / 2, W * 0.25, W / 2, H / 2, W * 1.1);
                        vg.addColorStop(0, 'rgba(0,0,0,0)');
                        vg.addColorStop(0.6, `rgba(0,0,0,${vignetteAlpha*0.5})`);
                        vg.addColorStop(1, `rgba(0,0,0,${vignetteAlpha})`);
                        ctx.fillStyle = vg;
                        ctx.fillRect(0, 0, W, H);
                    }
                }
                ctx.restore();
                if (screenFlash > 0.01) {
                    ctx.fillStyle = screenFlashColor;
                    ctx.globalAlpha = screenFlash * 0.50;
                    ctx.fillRect(0, 0, W, H);
                    ctx.globalAlpha = 1;
                }
                if (superKillFlash > 0.01) {
                    ctx.fillStyle = superKillColor;
                    ctx.globalAlpha = superKillFlash * 0.55;
                    ctx.fillRect(0, 0, W, H);
                    ctx.globalAlpha = 1;
                }
                if (screenPulse > 0.005) {
                    const pulseGrad = ctx.createRadialGradient(W / 2, H / 2, W * 0.3, W / 2, H / 2, W * 1.0);
                    pulseGrad.addColorStop(0, 'rgba(255,100,30,0)');
                    pulseGrad.addColorStop(0.5, `rgba(255,60,10,${screenPulse*0.38})`);
                    pulseGrad.addColorStop(1, 'rgba(255,20,0,0)');
                    ctx.fillStyle = pulseGrad;
                    ctx.fillRect(0, 0, W, H);
                }
                for (const ap of achievementPopups) {
                    const alpha = Math.min(1, ap.life / 1.8);
                    const popY = ap.y;
                    ctx.fillStyle = `rgba(0,0,0,${0.91*alpha})`;
                    drawRoundRect(ctx, W * 0.07, popY, W * 0.86, 52, 12);
                    ctx.fill();
                    ctx.strokeStyle = `rgba(212,160,23,${alpha})`;
                    ctx.lineWidth = 2.8;
                    drawRoundRect(ctx, W * 0.07, popY, W * 0.86, 52, 12);
                    ctx.stroke();
                    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                    ctx.font = `bold ${Math.min(W*0.036,13)}px Georgia, serif`;
                    ctx.textAlign = 'center';
                    ctx.fillText(`${ap.icon} ${ap.name}`, W / 2, popY + 24);
                    ctx.fillStyle = `rgba(200,200,200,${alpha})`;
                    ctx.font = `${Math.min(W*0.026,10)}px Georgia, serif`;
                    ctx.fillText(ap.desc, W / 2, popY + 42);
                    ctx.textAlign = 'left';
                }
                for (const st of scrollTexts) {
                    const alpha = Math.min(1, st.life / 1.5);
                    ctx.fillStyle = st.color;
                    ctx.globalAlpha = alpha;
                    ctx.font = `bold ${Math.min(W*0.046,17)}px Georgia, serif`;
                    ctx.textAlign = 'center';
                    ctx.fillText(st.text, W / 2, st.y);
                    ctx.textAlign = 'left';
                    ctx.globalAlpha = 1;
                }
                if (transitionAlpha > 0 && transitionAlpha < 1) {
                    transitionAlpha += 0.042;
                    ctx.fillStyle = `rgba(0,0,0,${transitionAlpha})`;
                    ctx.fillRect(0, 0, W, H);
                    if (transitionAlpha >= 1 && transitionTarget === 'cutscene') {
                        gameState = 'cutscene';
                        cutscenePhase = 0;
                        cutsceneTimer = 0;
                        cutsceneCharIndex = 0;
                        transitionAlpha = 0;
                        transitionTarget = '';
                        advanceCutscene();
                    }
                }
                if (transitionAlpha >= 1 && transitionTarget) { transitionAlpha = 0;
                    transitionTarget = ''; }
                const vignetteGrad = ctx.createRadialGradient(W / 2, H / 2, W * 0.48, W / 2, H / 2, W * 1.05);
                vignetteGrad.addColorStop(0, 'rgba(0,0,0,0)');
                vignetteGrad.addColorStop(0.65, 'rgba(0,0,0,0.15)');
                vignetteGrad.addColorStop(1, 'rgba(0,0,0,0.65)');
                ctx.fillStyle = vignetteGrad;
                ctx.fillRect(0, 0, W, H);
                if (cinematicBars !== targetCinematicBars) {
                    cinematicBars += (targetCinematicBars - cinematicBars) * 0.09;
                    if (Math.abs(cinematicBars - targetCinematicBars) < 0.1) cinematicBars = targetCinematicBars;
                }
                if (cinematicBars > 0.5) {
                    const barH = cinematicBars * 0.08 * H;
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 0, W, barH);
                    ctx.fillRect(0, H - barH, W, barH);
                }
                ctx.fillStyle = 'rgba(0,0,0,0.030)';
                for (let i = 0; i < H; i += 4) ctx.fillRect(0, i, W, 2);
            }

            function gameLoop() {
                update(Math.min(0.12, 1 / 60));
                render();
                requestAnimationFrame(gameLoop);
            }

            function getEventPos(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e
                        .clientY - r.top }; }
            canvas.addEventListener('click', e => { const p = getEventPos(e);
                handleTap(p.x, p.y); });
            canvas.addEventListener('touchstart', e => { e.preventDefault();
                initAudio();
                handleTap(getEventPos(e.touches[0]).x, getEventPos(e.touches[0]).y); }, { passive: false });
            canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
            canvas.addEventListener('touchend', e => e.preventDefault(), { passive: false });
            document.addEventListener('keydown', e => {
                if (e.key === ' ' || e.key === 'Enter') {
                    initAudio();
                    if (gameState === 'menu') { sfxMenuClick();
                        transitionTarget = 'cutscene';
                        transitionAlpha = 0.01; } else if (gameState === 'gameover') { sfxMenuClick();
                        resetGame();
                        gameState = 'menu'; } else if (gameState === 'cutscene') { sfxMenuClick();
                        cutscenePhase = 999;
                        cutsceneTimer = 999; } else if (gameState === 'playing' && tutorialPhase > 0)
                        tutorialTimer = Math.min(tutorialTimer, 0.35); }
                if (e.key === 'p' && gameState === 'playing') { bossEnemy = createBossEnemy();
                    enemies.push(bossEnemy);
                    bossWarning = 1;
                    sfxBossWarning(); }
                if (e.key === 'g' && gameState === 'playing') { const giant = createGiantEnemy();
                    bossEnemy = giant;
                    enemies.push(giant);
                    bossWarning = 1;
                    sfxBossWarning(); }
                if (e.key === 'e' && gameState === 'playing') { enemies.push(createEliteEnemy()); }
                if (e.key === 'c' && gameState === 'playing') { enemies.push(createChineseEnemy()); }
                if (e.key === 'h' && gameState === 'playing') { enemies.push(createHezbollahEnemy()); }
            });

            function init() {
                resizeCanvas();
                initBgElements();
                const saved = localStorage.getItem('persianVengeanceHighScore');
                if (saved) highScore = parseInt(saved) || 0;
                gameState = 'menu';
                resetGame();
                for (let i = 0; i < 5; i++) { const e = createEnemy(H * 0.26 + i * 100);
                    e.alive = true;
                    e.speed = 0.08;
                    enemies.push(e); }
            }
            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 350));
            init();
            requestAnimationFrame(gameLoop);
            console.log('%c🛡️ OPERATION: PERSIAN VENGEANCE — APOCALYPSE CUT (EXTENDED)',
                'color:#ff4400;font-size:28px;font-weight:bold;');
            console.log('%cDefend the line. Eliminate all threats. No mercy. No surrender.',
                'color:#d4a017;font-style:italic;font-size:17px;');
            console.log('%c🇺🇸 FREEDOM PREVAILS — STAND YOUR GROUND 🇺🇸',
                'color:#ff0000;font-size:22px;font-weight:bold;');
            console.log('%c🦅 EXTENDED CUT — CHINESE & HEZBOLLAH ENEMIES, MORE CARNAGE 🦅',
                'color:#ffdd00;font-size:15px;');
        })();
    </script>
</body>
</html>
